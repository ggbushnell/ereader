# One-tab browser companion: build the decoder to WebAssembly on GitHub's
# machine, check it against the native build, publish the page to Pages.
# Nothing here runs on the laptop; it only pushes.
#
# The asset pack is built from pret/pokered for the parity test only. It is
# never published: the page asks for the user's own pack from disk.
name: companion-web

on:
  push:
    branches: [browser-allinone]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out pret/pokered (the commit the pack was built from locally)
        uses: actions/checkout@v4
        with:
          repository: pret/pokered
          ref: d2704a63c26f9ba046ade877445216b3de0519a4
          path: third_party/pokered

      - name: Asset pack (test only, never published)
        run: python3 tools/pokered_pack.py --src third_party/pokered --out build_pack --no-preview

      # Compiler errors are re-posted as annotations so they can be read
      # through the public API without logging in.
      - name: Native pokeview
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev
          sh native/build.sh > build.log 2>&1 || { grep -m 20 -E 'error|Error' build.log | sed 's/^/::error::/'; exit 1; }

      - name: WebAssembly pokeview
        run: |
          docker run --rm -v "$PWD":/src -w /src emscripten/emsdk:3.1.74 sh native/build_wasm.sh > wasm.log 2>&1 \
            || { grep -m 20 -E 'error|Error' wasm.log | sed 's/^/::error::/'; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parity test (native vs WebAssembly)
        run: node native/wasm/parity_test.mjs native/pokeview build_pack/pokered.pack

      # The service worker ships pokeview-sw.wasm; the parity test ran
      # pokeview.wasm. Same sources and flags apart from the JS glue, so the
      # two should be the same program; say so if they ever are not.
      - name: Check the shipped decoder is the tested one
        run: |
          cmp native/out/wasm/pokeview.wasm native/out/wasm/pokeview-sw.wasm \
            && echo "pokeview-sw.wasm is byte-identical to the tested pokeview.wasm" \
            || echo "::warning::pokeview-sw.wasm differs from the tested pokeview.wasm"
          node --check allinone/sw.js

      # The game page (www/) and the companion (native/web/) are copied
      # unchanged; sw.js serves them and answers their server calls.
      - name: Assemble the site
        run: |
          mkdir -p _site/www/vendor _site/web
          sed "s/BUILD_SHA/${GITHUB_SHA::7}/" allinone/index.html > _site/index.html
          sed "s/BUILD_SHA/${GITHUB_SHA::7}/" allinone/sw.js > _site/sw.js
          cp native/out/wasm/pokeview-sw.js native/out/wasm/pokeview-sw.wasm _site/
          cp www/index.html www/app.js _site/www/
          cp www/vendor/gb.js www/vendor/nes.js _site/www/vendor/
          cp native/web/index.html native/web/app.js native/web/style.css _site/web/
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
